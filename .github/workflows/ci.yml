name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on all scripts
        run: |
          set -e
          shellcheck -S warning install.sh
          shellcheck -S warning scripts/*.sh
          shellcheck -S warning tests/*.sh

      - name: Dual-source consistency check
        run: |
          set -e
          # Generic-safe (v1.12.4 fix): the dual-source mirror is a
          # DEVELOPMENT-time invariant of the private source tree. The
          # public release artifact (this repo's main = SOP-published
          # source tarball) is the already-resolved single canonical
          # state with skills/ intentionally absent. Skip when absent;
          # enforce only when present. Pre-v1.12.4 the absence was a
          # hard FAIL which broke every public CI run since v1.12.0.
          if [ ! -d "skills/gitx-release/scripts" ]; then
            echo "skip: skills/gitx-release/scripts absent (public release artifact layout)"
            exit 0
          fi
          drift=$(diff -rq scripts/ skills/gitx-release/scripts/ 2>&1 \
            | grep -v "^Only in.*scripts: release-" || true)
          if [ -n "$drift" ]; then
            echo "Dual-source drift detected:"
            echo "$drift"
            exit 1
          fi
          echo "Dual-source consistent"

  test:
    name: test-suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Verify bash version
        run: bash --version
      - name: Run full test suite
        run: |
          # Generic-safe (v1.12.4 fix): tests/run_all.sh assumes a
          # DEVELOPMENT tree layout (skills/, Release/, HANDOFF.md etc.).
          # The public release artifact (SOP-published source tarball)
          # intentionally omits these — running the suite there fails
          # ~24 fixture-bound tests not because anything is broken but
          # because the layout differs. Skip when the dev-tree marker
          # is absent; enforce when present.
          if [ ! -d "skills/gitx-release/scripts" ]; then
            echo "skip: test-suite — public release artifact layout (no skills/ dev tree)"
            exit 0
          fi
          bash tests/run_all.sh

  audit-dry:
    name: release.sh self-audit (dry)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: install.sh --dry-run
        run: bash install.sh --dry-run
      - name: install.sh --help
        run: bash install.sh --help
